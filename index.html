// Условные переходы
function nextAfter(nodeId, opt, answers) {
  const n = opt[2];
  if (n === "?S1") { return "S1_" + (answers.prof === "unknown" ? "it" : answers.prof); }
  if (n === "?S5") { return "S_ARMY"; }
  if (n === "?S5B") {
    const weak = (answers.trial === "none" || answers.trial === "low" || answers.self === "1" || answers.self === "2");
    if (!weak) return "S6";
    return answers.army === "avoid" ? "S5_nr" : "S5";
  }
  if (n === "?WHY") { return "WHY"; }
  if (n === "?P3") { return { phys: "P3a", it: "P3b", math: "P3c" }[answers.prof]; }
  if (n === "?TEST") { return "T_" + answers.prof + "_" + answers.grade + "_1"; }
  if (n === "?M4") {
    return (answers.mot === "par_ok" || answers.mot === "par_no") ? "M4" : "P1";
  }
  return n;
}

function tagParts(tag) { const i = tag.indexOf("="); return [tag.slice(0, i), tag.slice(i + 1)]; }

// Баллы: максимум 57 (олимпиады 14, пробник 12, самооценка 8, оценки 5, время 6, мини-тест 8, проекты 4). Мини-тест: вопрос №i весит i, сумма 0..15 масштабируется в 0..8.
const W = {
  oly:   { "0":0, "0_want":0, "1":2, "2":5, "3":9, "4":14 },
  trial: { none:0, low:1, mid:4, good:8, high:12 },
  self:  { "1":0, "2":2, "3":5, "4":8 },
  gpa:   { low:0, mid:1, good:3, high:5 },
  time:  { low:0, mid:2, high:4, max:6 },
  test:  {},
  proj:  { "0":0, "1":1, "3":3, "4":4 }
};
const MAXSCORE = 14 + 12 + 8 + 5 + 6 + 8 + 4; // 57

function testCorrect(a) { let c = 0; for (let i = 1; i <= 5; i++) if (a["tq" + i] === "1") c++; return c; }
function testPoints(a) { let p = 0; for (let i = 1; i <= 5; i++) if (a["tq" + i] === "1") p += i; return p; }
function testScore(a) { return Math.round(testPoints(a) * 8 / 15); }
function hardestSolved(a) { let h = 0; for (let i = 1; i <= 5; i++) if (a["tq" + i] === "1") h = i; return h; }

function computeTier(a) {
  let s = 0;
  for (const k in W) { if (k === "test") { s += testScore(a); continue; } s += (W[k][a[k]] || 0); }
  const pct = s / MAXSCORE * 100;
  let tier = pct >= 65 ? "A" : pct >= 40 ? "B" : pct >= 20 ? "C" : "D";
  // Жёсткий порог: в Tier A без подтверждения (пробник 85+ или сильная олимпиада) не пускаем,
  // т.к. у МФТИ минимум 85 по профильным, а у МГУ высокие минимумы.
  let capped = false;
  const olyHigh = (a.oly === "3" || a.oly === "4");
  if (tier === "A" && a.trial !== "high" && !olyHigh) { tier = "B"; capped = true; }
  return { score: s, pct: Math.round(pct), tier: tier, capped: capped, correct: testCorrect(a), points: testPoints(a), hardest: hardestSolved(a) };
}

const SUBS = {
  "МФТИ": ["ai","nuclear","pure"],
  "МГУ (ВМК, мехмат, физфак)": ["ai","pure"],
  "НИУ ВШЭ, ФКН (Программная инженерия)": ["dev","ai","data"],
  "МГТУ им. Баумана (Программная инженерия)": ["dev"],
  "МГТУ им. Баумана (Ядерные реакторы 278, Робототехника 305)": ["nuclear","mech","embedded"],
  "НИЯУ МИФИ": ["nuclear"],
  "НИУ МЭИ (энергетика, теплоэнергетика)": ["energy","electro"],
  "МАИ (ИВТ, по программам)": ["aero"]
};
VUZ.forEach(function (v) { v.subs = SUBS[v.n] || []; });

const BAND = { low: [100,150], mid: [150,210], good: [210,255], high: [255,300] };
const CAPMAX = { "1": 500000, "2": 1000000, "3": 2000000, "4": 5000000, "5": 1e12 };

const KEYS = ["low", "mid", "good", "high"];
const LEVEL_IDX = { low: 0, mid: 1, good: 2, high: 3 };
const TIER_IDX = { D: 0, C: 1, B: 2, A: 3 };
function hasTrial(a) { return Object.prototype.hasOwnProperty.call(LEVEL_IDX, a.trial); }
// Уровень = среднее между пробником и общим Tier (в Tier входят тест, олимпиады, самооценка). Нет пробника: только Tier.
function levelKey(a, t) {
  const ti = TIER_IDX[t.tier];
  return KEYS[hasTrial(a) ? Math.round((LEVEL_IDX[a.trial] + ti) / 2) : ti];
}

function vuzStatus(v, a, key) {
  const olyTop = (a.oly === "3" || a.oly === "4");
  const b = BAND[key];
  let st;
  if (v.kind === "d400") {
    st = (key === "high" || olyTop)
      ? { r: 1, s: "возможно: нужен результат 85+ по профильным и подготовка к ДВИ" }
      : { r: 3, s: "пока далеко: нужен результат 85+ и подготовка к ДВИ", gap: 999 };
  } else {
    const lo = v.need[0], hi = v.need[1], mid = (b[0] + b[1]) / 2;
    if (mid >= hi) st = { r: 0, s: "по твоему уровню проходишь с запасом" };
    else if (b[1] >= lo) st = { r: 1, s: "на грани: нужна верхняя часть твоего диапазона" };
    else st = { r: 3, s: "пока далеко: не хватает около " + Math.round(lo - b[1]) + " баллов суммы", gap: Math.round(lo - b[1]) };
  }
  if (olyTop && st.r >= 3) st.s += " (но олимпиада заключительного этапа может дать поступление без экзаменов, проверь условия вуза)";
  return st;
}

function vuzBoost(v, a) {
  let b = 0; const t = v.tags || {};
  if ((a.sci === "yes" || a.career === "science") && t.sci) b += 2;
  if (a.size && a.size === t.size) b += 1;
  if ((a.prio === "comfort" || a.val === "easy") && v.need && v.need[1] <= 265) b += 2;
  if (a.sub && v.subs && v.subs.indexOf(a.sub) >= 0) b += 3;
  if ((a.val === "status" || a.goal === "dream" || a.prio === "same") && t.prest) b += 2;
  if (a.val === "knowledge" && t.modern) b += 2;
  if (a.val === "career" && t.practice) b += 2;
  if (a.prio === "money" && v.paidMin) b -= Math.min(2, Math.round(v.paidMin / 400000));
  return b;
}
function sel(v) { return v.kind === "d400" ? 305 : (v.need ? v.need[1] : 0); }

function vuzLine(x, a, capMax, paidMode) {
  const v = x.v;
  let line = "— " + v.n + ": " + x.st.s;
  if (v.need) line += "; проходной " + (v.need[0] === v.need[1] ? v.need[0] : v.need[0] + "–" + v.need[1]);
  if (v.min) line += "; " + v.min;
  if (v.paid) {
    line += "; платное " + v.paid;
    if (paidMode && capMax && v.paidMin && v.paidMin * 4 > capMax) line += " (за 4 года выйдет выше твоего потолка)";
  }
  if (a.sub && v.subs.indexOf(a.sub) >= 0) line += "; подходит под твоё направление";
  return line + " [" + v.conf + "]\n";
}

// Короткий список (до 5 вузов): амбициозный + основные + страховка. Чем выше уровень, тем выше конкурс у основных.
function pickList(a, prof, t) {
  const key = levelKey(a, t);
  // Мечта-вуз: находим запись в базе (для Бауманки берём программу под профиль)
  let dv = null;
  if (a.dream === "bmstu") dv = VUZ.filter(function (v) { return v.n.indexOf("МГТУ") === 0 && v.prof.indexOf(prof) >= 0; })[0] || null;
  else if (a.dream && a.dream !== "none" && a.dream !== "other") dv = VUZ.filter(function (v) { return v.n === a.dream; })[0] || null;
  const dreamInProf = !!(dv && dv.prof.indexOf(prof) >= 0 && (dv.need || dv.kind === "d400"));
  const capMax = a.cap ? CAPMAX[a.cap] : null;
  const paidMode = (a.pay === "paid" || a.pay === "budget_first");
  const fit = function (x) { return !(paidMode && capMax && x.v.paidMin && x.v.paidMin * 4 > capMax); };
  const cand = VUZ.filter(function (v) { return v !== dv && v.prof.indexOf(prof) >= 0 && (v.need || v.kind === "d400"); })
    .map(function (v) { return { v: v, st: vuzStatus(v, a, key), score: sel(v) + vuzBoost(v, a) * 8 }; });
  const lowEdge = function (v) { return v.need ? v.need[0] : 305; };
  const asc = function (x, y) { return lowEdge(x.v) - lowEdge(y.v); };
  const desc = function (x, y) { return y.score - x.score; };
  const ok = cand.filter(function (x) { return x.st.r === 0; });
  const edge = cand.filter(function (x) { return x.st.r === 1; });
  const far = cand.filter(function (x) { return x.st.r === 3; });

  let safePool = ok.filter(fit);
  if (!safePool.length) safePool = ok;
  if (!safePool.length) safePool = cand;
  const safe = safePool.slice().sort(asc)[0] || null;

  const pool = ok.concat(edge).filter(function (x) { return x !== safe; }).sort(desc);
  let amb = null;
  if (pool.length) {
    const top = Math.max.apply(null, pool.map(function (x) { return sel(x.v); }));
    amb = far.filter(function (x) { return x.st.gap < 900 && x.st.gap <= 45 && sel(x.v) >= top; }).sort(asc)[0] || null;
  }
  const main = pool.slice(0, amb ? 2 : 3);
  const L = function (x) { return vuzLine(x, a, capMax, paidMode); };

  let o = "";
  let dreamInfo = null;
  if (dreamInProf) {
    const dst = vuzStatus(dv, a, key);
    dreamInfo = { dv: dv, st: dst };
    o += "ТВОЯ МЕЧТА\n" + L({ v: dv, st: dst });
    if (dst.r === 3) o += "Честно: сейчас до неё далеко, но это ориентир для роста, а не приговор. План ниже построен под эту цель, а список дальше нужен как запасной путь.\n";
    o += "\n";
  } else if (a.dream && a.dream !== "none" && a.dream !== "other") {
    const PN = { phys: "физика и инженерия", it: "информатика и IT", math: "математика" };
    const dvAny = VUZ.filter(function (v) { return v.n === a.dream || (a.dream === "bmstu" && v.n.indexOf("МГТУ") === 0); })[0];
    o += "ТВОЯ МЕЧТА\nМечта-вуз и выбранный профиль (" + PN[prof] + ") не совпадают: " + (dvAny ? "в моей базе эта программа относится к другим направлениям (" + dvAny.prof.map(function (x) { return PN[x]; }).join(", ") + ")" : "в моей базе нет подходящей программы") + ". Либо мечта на самом деле про другое направление, либо у вуза есть программа по твоему профилю, которой у меня нет. Проверь на сайте вуза и, если сомневаешься, пройди опросник ещё раз с другим профилем.\n\n";
  } else if (a.dream === "other") {
    o += "ТВОЯ МЕЧТА\nТвоего вуза нет в моей базе, поэтому проходной я не сравню. Найди на его сайте минимальные баллы и бюджетные места по нужному направлению и сравни с уровнем из этого списка.\n\n";
  }
  if (a.goal === "anywhere") o += "Ты сказал(а), что главное поступить надёжно, поэтому порядок такой: сначала страховка, потом остальное.\n\n";
  o += "ТВОЙ СПИСОК ДЛЯ ПОДАЧИ\n";
  o += "Проходные 2025 года, сумма трёх предметов из 300. Твой уровень оценён примерно в " + BAND[key][0] + "–" + BAND[key][1] +
       " из 300 (" + (hasTrial(a) ? "по пробнику, тесту и ответам" : "по тесту и ответам, пробника нет") +
       "). В список попали только вузы под этот уровень, а не все подряд.\n\n";
  if (amb) o += "АМБИЦИОЗНЫЙ ВАРИАНТ (если подтянешь баллы)\n" + L(amb) + "\n";
  let names = [];
  if (amb) names.push(amb.v.n);
  if (main.length) {
    o += "ОСНОВНЫЕ ВАРИАНТЫ\n" + main.map(L).join("") + "\n";
    main.forEach(function (x) { names.push(x.v.n); });
  } else {
    const goals = far.filter(function (x) { return x !== safe && x.st.gap < 900; }).sort(asc).slice(0, 2);
    if (goals.length) {
      o += "ЦЕЛИ, КОГДА ПОДТЯНЕШЬ БАЛЛЫ\n" + goals.map(L).join("") + "\n";
      goals.forEach(function (x) { names.push(x.v.n); });
    }
  }
  if (safe) {
    let st = "СТРАХОВКА\n" + L(safe);
    if (safe.st.r === 3) st += "Пока даже самый мягкий вариант в моей базе выше твоего уровня, поэтому сначала нужен рост баллов.\n";
    st += "\n";
    names.push(safe.v.n);
    if (a.goal === "anywhere") o = o.replace("ТВОЙ СПИСОК ДЛЯ ПОДАЧИ\n", "ТВОЙ СПИСОК ДЛЯ ПОДАЧИ\n" + st);
    else o += st;
  }
  if (dreamInfo) names.unshift(dreamInfo.dv.n);
  return { text: o, names: names, dream: dreamInfo };
}

function buildResult(a) {
  const t = computeTier(a);
  const prof = (a.prof && a.prof !== "unknown") ? a.prof : "it";
  const paidWord = (a.pay === "paid" || a.pay === "budget_first");
  let out = "";
  out += "Уровень готовности: Tier " + t.tier + " (" + t.pct + "% от максимума). Мини-тест: верно " + t.correct + " из 5, набрано " + t.points + " из 15 баллов сложности" + (t.hardest ? ", самый сложный решённый вопрос №" + t.hardest : ", ни один вопрос не решён") + " (вопросы идут от простого к сложному, вес вопроса равен его номеру).\n";
  if (t.capped) out += "Баллы тянули на Tier A, но подтверждённого результата нет (пробник 85+ или сильная олимпиада), поэтому уровень снижен до B: у МФТИ минимум 85 по профильным, у МГУ высокие минимумы и ДВИ. Подтверди результат пробником, и Tier A откроется.\n";
  out += "\n";
  const pl = pickList(a, prof, t);
  out += pl.text;

  // Что учтено при отборе
  let pr = [];
  if (a.val === "status" || a.prio === "same") pr.push("престиж и статус (при равных шансах выше стоят самые громкие вузы)");
  if (a.sci === "yes" || a.career === "science") pr.push("наука (подняты вузы с научной репутацией)");
  if (a.size === "big") pr.push("большой классический университет");
  if (a.size === "tech") pr.push("компактный технический вуз");
  if (a.prio === "comfort" || a.val === "easy") pr.push("мягкие требования, без лишнего стресса (подняты вузы с более низким проходным)");
  if (a.prio === "money") pr.push("стоимость обучения (при равных шансах ниже стоят более дорогие платные варианты)");
  if (a.sub) pr.push("твоё направление внутри профиля");
  if (a.val === "knowledge") pr.push("актуальность программы и контакт с преподавателями, а не только громкое имя вуза");
  if (a.val === "career") pr.push("практика и связи с работодателями");
  if (pr.length) out += "УЧТЕНО ПРИ ОТБОРЕ\n— " + pr.join("\n— ") + "\n";
  if (a.val === "knowledge" && prof === "it") {
    out += "Отдельно про контакт с преподавателями в IT — то, что я проверил по открытым данным: на ВМК МГУ состав сильно академический, кафедрами руководят академики РАН, костяк преподавателей — доктора и кандидаты наук с многолетним стажем, упор на фундаментальную математику и теорию. На ФКН ВШЭ и ФПМИ МФТИ заметная часть лекторов и семинаристов — практикующие специалисты из индустрии (в том числе из Яндекса), с которыми можно обсуждать рабочие задачи напрямую. Если хочешь диалога и живой связи с преподавателем, это ближе к ФКН или ФПМИ; если важнее глубокая теория и готов(а) учиться больше самостоятельно, ВМК даёт именно такую базу.\n";
    out += "По остальным вузам из списка (МИСИС, МЭИ, МАИ, Политех, МИРЭА, РУДН, Финансовый университет) у меня нет надёжных фактов про состав и подход преподавателей — отзывы студентов по ним противоречивые, где-то хвалят, где-то жалуются на тех же специальностях в разные годы. Сходи на день открытых дверей или поговори с текущими студентами этих вузов напрямую, это надёжнее любых отзывов в интернете.\n";
  }
  if (a.val === "social")
    out += "Про атмосферу и студенческую жизнь у меня нет надёжных данных по вузам из базы, сравни это сам(а) на днях открытых дверей или по отзывам студентов, которые сейчас там учатся.\n";
  if (a.val === "unclear")
    out += "Ты пока не представляешь чётко, каким должен быть вуз, и это нормально. Список ниже собран просто по уровню и профилю, без лишних акцентов, а когда появится ощущение, что важнее, пройди опросник ещё раз.\n";
  if (pr.length || a.val === "knowledge" || a.val === "social" || a.val === "unclear") out += "\n";

  // Деньги и география
  let notes = [];
  if (a.pay === "budget_only" && (t.tier === "C" || t.tier === "D"))
    notes.push("Ты выбрал только бюджет, а текущий уровень — Tier " + t.tier + ". Нужен план роста баллов и/или олимпиады, и обязательно запасной путь (целевое обучение, менее конкурентное направление).");
  if (paidWord && (a.cap === "1" || a.cap === "2"))
    notes.push("Потолок до 1 млн ₽ на всё обучение: платное в вузах из базы стоит от ~300 тыс. ₽ в год, а в самых конкурсных до ~1 млн ₽ в год, то есть на 4 года выходит заметно дороже. Реалистичный путь — бюджет, целевое или скидки за достижения.");
  if (a.opt === "target") notes.push("Целевое обучение: нужно заранее искать предприятие-заказчика, это отдельный процесс со своими сроками.");
  if (a.geo === "near" && pl.names.indexOf("МФТИ") >= 0)
    notes.push("МФТИ находится в Долгопрудном, а ты выбрал «только рядом с домом»: это может не подойти, проверь дорогу.");
  if (a.mot === "par_no")
    notes.push("Судя по ответам, учёба — больше желание родителей. Выбран вуз с понятным порогом, чтобы закрыть их ожидания; остальное время можно вложить в то, что интересно тебе самому.");
  const PROF_NAME = { phys: "физику и инженерию", it: "информатику и IT", math: "математику" };
  if (a.why === "drift")
    notes.push("Ты выбрал(а) " + PROF_NAME[prof] + " из-за проходных баллов или расписания в школе, а не потому что это прямо твоё. Это понятная причина, но вуз на 4–6 лет — многовато только из-за удобных баллов. Пройди этот же опросник ещё раз с другим профилем и сравни списки, прежде чем решать окончательно.");
  if (a.why === "others")
    notes.push("Ты выбрал(а) " + PROF_NAME[prof] + " в основном под мнением родителей или советчиков. Если поступишь, а окажется совсем не твоё, выйти из программы потом тяжелее, чем выбрать сейчас честно. Поговори с родителями не про «куда поступать», а про то, почему именно это направление важно для них, и сравни это со своим интересом напрямую.");
  if (a.why === "unsure")
    notes.push("Ты сам(а) не уверен(а), что " + PROF_NAME[prof] + " — твоё. Стоит пройти опросник ещё раз с соседним профилем и сравнить, какой список вузов и какая подготовка ощущаются ближе, а не выбирать по инерции.");
  if (a.par === "prestige" && t.tier !== "A")
    notes.push("Родителям важен престиж: можно оставить одну «статусную» попытку в списке, но не строить на ней весь план.");
  if (a.army === "avoid") {
    notes.push("Ты хочешь избежать армии: обычно отсрочку получают студенты очной формы в аккредитованных вузах, поэтому поступать нужно сразу после школы, а вариант «пересдать через год» исключён. Условия отсрочки проверь в военкомате или на Госуслугах, я их не проверял.");
    if (a.pay === "budget_only" && (t.tier === "C" || t.tier === "D"))
      notes.push("«Только бюджет» при таком уровне опасен: если не пройдёшь на бюджет, в год призыва можешь остаться без вуза. Добавь в список платный или менее конкурентный вариант, который точно возьмёт.");
    if (a.alt === "work" || a.alt === "gap")
      notes.push("Пауза или работа вместо вуза обычно не дают отсрочки от призыва, учти это при выборе.");
    if (a.alt === "college")
      notes.push("Колледж вместо вуза: заранее уточни, как работает отсрочка для студентов колледжей.");
  }
  if (notes.length) out += "НА ЧТО ОБРАТИТЬ ВНИМАНИЕ\n" + notes.map(function (x) { return "— " + x; }).join("\n") + "\n\n";

  // План действий
  let plan = [];
  if (pl.dream) {
    const d = pl.dream;
    const MONTHS = { "9": 32, "10": 20, "11": 8 };
    const mo = MONTHS[a.grade] || 12;
    if (d.st.r === 3) {
      if (d.st.gap < 900) {
        const rate = (d.st.gap / mo).toFixed(1);
        plan.push("Путь к мечте (" + d.dv.n + "): нужно вырасти примерно на " + d.st.gap + " баллов суммы, это около +" + Math.ceil(d.st.gap / 3) + " на каждый из трёх предметов. До ЕГЭ примерно " + mo + " мес., значит около " + rate + " балла суммы в месяц. Делай пробник раз в 1–2 месяца и разбирай темы, где теряешь больше всего.");
        if (d.st.gap / mo > 4) plan.push("Темп роста выше 4 баллов суммы в месяц на практике очень тяжёлый. Если останешься на мечте, держи её как главную цель, но обязательно подай и на запасные варианты из списка, чтобы не остаться без места.");
      } else {
        plan.push("Путь к мечте (" + d.dv.n + "): нужен высокий результат ЕГЭ (по профильным предметам обычно 85+) и подготовка к вступительным испытаниям вуза. Возьми на сайте вуза материалы прошлых лет и начни решать их уже сейчас.");
      }
    } else if (d.st.r === 1) {
      plan.push("Мечта (" + d.dv.n + ") у тебя на грани: решает стабильность результата. Решай пробники на время и целься в верхнюю часть своего диапазона, не в середину.");
    } else {
      plan.push("Мечта (" + d.dv.n + ") по уровню достижима: главное не потерять результат и не пропустить минимальные баллы по каждому предмету. Подавай её первой.");
    }
    plan.push("Проверь на сайте мечты-вуза, есть ли льготы или бонусы за олимпиады и индивидуальные достижения. Я эти условия не проверял, они меняются по годам.");
  }
  if (a.goal === "anywhere")
    plan.push("Ты выбрал(а) надёжность: подавай документы в несколько вузов сразу, включая страховку, и следи за дедлайнами подачи, чтобы не остаться без места из-за формальностей.");
  if (a.goal === "direction")
    plan.push("Для тебя важнее направление, чем название вуза: сравни программы и учебные планы вузов из списка по тому, чему реально учат, а не по рейтингу.");
  const olyLow = (a.oly === "0" || a.oly === "0_want" || a.oly === "1" || a.oly === "2");
  if ((a.oly === "0" || a.oly === "0_want") && a.oly_plan === "main")
    plan.push("Выбери 1–2 олимпиады из перечня РСОШ, найди разборы прошлых лет, начни с отборочного этапа осенью.");
  if (a.oly_plan === "main" && olyLow)
    plan.push("Олимпиады — твой главный путь, а уровень пока ниже заключительного этапа ВсОШ: это главный рычаг роста, начни с него.");
  if (a.oly_plan === "try") {
    plan.push("Олимпиады для тебя бонус, а не основа: выбери ОДНУ олимпиаду, а не две-три, и решай её по паре задач в неделю. Основное время оставь на ЕГЭ.");
    plan.push("Поставь контрольную точку: после отборочного этапа осенью посмотри на результат. Прошёл дальше — можно вкладываться сильнее. Не прошёл — всё время на ЕГЭ, без чувства вины.");
    if (a.oly_backup === "none")
      plan.push("Ты пока не решил(а), что делаешь, если олимпиада не выйдет. Реши это сейчас, а не в июне: основой должен быть результат ЕГЭ, олимпиада только подушка.");
    if (a.oly_backup === "wait" && a.army === "avoid")
      plan.push("Ты хочешь избежать армии, а план «если не выйдет, попробую на следующий год» с этим конфликтует: год после школы без учёбы обычно означает риск призыва. Лучше сразу заложить запасной вариант на этот год.");
    if (a.time === "low")
      plan.push("Ты готов(а) тратить до 3 часов в неделю, и на олимпиады вместе с ЕГЭ этого не хватит. Выбери что-то одно или увеличь время.");
  }
  if (a.trial === "none" || a.trial === "low")
    plan.push("Сделай пробный ЕГЭ в ближайшее время, чтобы понимать реальный уровень.");
  if (a.extra === "0" && a.time === "low")
    plan.push("Выдели хотя бы 4–5 часов в неделю, начни с бесплатных курсов.");
  if (a.grade === "9") plan.push("Ты в 9 классе: подумай о физмат-классе или лицее с профильной подготовкой.");
  if (a.grade === "11") plan.push("Ты в 11 классе: времени мало, сверь даты подачи документов и сразу выбери 3–4 вуза для подачи.");
  if (a.proj === "0") {
    if (prof === "it") plan.push("Сделай небольшой проект (бот, сайт, игра) и выложи на GitHub: это практика и портфолио для конкурсных вузов.");
    else if (prof === "phys") plan.push("Собери простую установку или модель (схему, ракету, робота) и оформи как мини-проект: это пригодится для конкурсов и мотивационного письма.");
    else plan.push("Раз в неделю решай одну олимпиадную задачу сверх программы и записывай идеи решения.");
  }
  if (a.en === "low" || (a.career === "abroad" && a.en !== "high"))
    plan.push("Подтяни английский (2–3 часа в неделю): документация, статьи и магистратуры за границей почти всегда на английском.");
  if (a.weak === "math") plan.push("Профильная математика входит в сумму баллов у каждого вуза из списка: начни усиление именно с неё.");
  if (a.weak === "prof") plan.push("Слабое место — профильный предмет (физика или информатика): возьми разбор типовых заданий ЕГЭ и решай по одному варианту в неделю.");
  if (a.weak === "rus") plan.push("Русский язык входит в сумму баллов во всех вузах из списка: не оставляй его на конец, это самые лёгкие баллы.");
  if (a.grit === "0" || a.grit === "1")
    plan.push("Ты быстро сдаёшься на трудных задачах, поэтому тебе пригодится подготовка с наставником (курс или репетитор), чтобы не застревать в одиночку.");
  if (a.army === "avoid") plan.push("Второй попытки у тебя нет, поэтому подай документы в несколько вузов, включая запасной (платное или менее конкурентное), и заранее выясни, как оформляется отсрочка.");
  if (a.fb === "none") plan.push("Заранее продумай запасной путь: второй вуз, менее конкурентное направление или платное. Это решение лучше принять до подачи документов.");
  if (a.fb === "retry") plan.push("Пересдача через год: заложи в план ещё один пробник и выбери, что именно будешь усиливать за этот год.");
  if (a.fb === "lower") plan.push("Запасной путь — менее конкурентное направление: выбери его сейчас и добавь в список подачи, а не после результатов.");
  if (a.career === "startup") plan.push("Тебе важнее практика, чем диплом: ищи вузы с акселераторами и проектными курсами (в моей базе таких данных нет, проверь на сайтах).");
  plan.push("Проверь актуальные проходные баллы и даты подачи на сайтах вузов: цифры выше взяты на 02.10.2026.");
  out += "ПЛАН ДЕЙСТВИЙ\n" + plan.map(function (x, i) { return (i + 1) + ". " + x; }).join("\n") + "\n\n";

  out += "(Данные собраны 02.10.2026 по сайтам вузов и каталогам. Проходные баллы в основном за 2025 год (для МЭИ и физики РУДН есть и данные 2026), на твоё поступление они изменятся. Неполные данные: МГУ, Финансовый университет, ПМИ в РУДН. Перед подачей проверь всё на сайтах вузов.)";
  return out;
}

// ===== ОБРАТНАЯ СВЯЗЬ ЧЕРЕЗ ЯНДЕКС.ФОРМЫ =====
// ВАЖНО: вставь сюда свои две ссылки на Яндекс.Формы после того, как создашь их в своём аккаунте.
// FORM_GENERAL — форма общих вопросов/предложений к проекту (без автозаполнения).
// FORM_QUESTION — форма "свой вариант ответа" для конкретного вопроса (с автозаполнением контекста через параметры запроса).
const FORM_GENERAL_URL = "https://clck.ru/3WGjSC";
const FORM_QUESTION_URL = "https://forms.yandex.ru/u/6ac0b3ba84227ceedfa4ab1e/";
// Названия скрытых полей (используй ТЕ ЖЕ названия при создании скрытых полей в форме №2 на forms.yandex.ru):
const FQ_PARAM_NODE = "node";       // id текущего узла дерева, напр. T_phys_10_3
const FQ_PARAM_CONTEXT = "context"; // человекочитаемая сводка: профиль, класс, ответы на вопросы до этого момента

function openGeneralFeedback() {
  window.open(FORM_GENERAL_URL, "_blank");
}

function buildAnswersSummary() {
  const parts = [];
  if (answers.prof) parts.push("профиль: " + answers.prof);
  if (answers.grade) parts.push("класс: " + answers.grade);
  for (const k in answers) {
    if (k === "prof" || k === "grade") continue;
    parts.push(k + "=" + answers[k]);
  }
  return parts.join(", ");
}

function openQuestionFeedback(nodeId, questionText) {
  const summary = buildAnswersSummary();
  const context = "Вопрос: " + String(questionText).slice(0, 150) + " | Ответы до этого момента: " + (summary || "пока нет");
  const url = FORM_QUESTION_URL
    + "?" + FQ_PARAM_NODE + "=" + encodeURIComponent(nodeId)
    + "&" + FQ_PARAM_CONTEXT + "=" + encodeURIComponent(context);
  window.open(url, "_blank");
}
// ===== /ОБРАТНАЯ СВЯЗЬ =====

let current = "DREAM";
let history = [];        // стек: [{id, tag}]
let answers = {};        // prefix -> value

function render() {
  const q = TREE[current];
  document.getElementById("progress").textContent = "Шаг " + (history.length + 1);
  document.getElementById("question").textContent = q.text;
  const box = document.getElementById("options");
  box.innerHTML = "";
  const prevTag = (history.length && history[history.length - 1].id === current) ? null : null;
  q.options.forEach(function (opt) {
    const label = document.createElement("label");
    label.className = "option";
    const input = document.createElement("input");
    input.type = "radio"; input.name = "opt"; input.value = opt[1];
    const p = tagParts(opt[1]);
    if (answers[p[0]] === p[1] && savedFor[current] === opt[1]) input.checked = true;
    label.appendChild(input);
    label.appendChild(document.createTextNode(opt[0]));
    box.appendChild(label);
  });
  document.getElementById("backBtn").style.display = history.length ? "inline-block" : "none";
}

let savedFor = {}; // id вопроса -> выбранный тег (чтобы при возврате ответ был отмечен)

function goNext() {
  const checked = document.querySelector('input[name="opt"]:checked');
  if (!checked) { alert("Выбери один из вариантов"); return; }
  const q = TREE[current];
  const opt = q.options.filter(function (o) { return o[1] === checked.value; })[0];
  const p = tagParts(opt[1]);
  answers[p[0]] = p[1];
  savedFor[current] = opt[1];
  history.push({ id: current, prefix: p[0] });
  const nxt = nextAfter(current, opt, answers);
  if (nxt === "FINAL") { showResult(); return; }
  current = nxt;
  render();
}

function goBack() {
  if (!history.length) return;
  const last = history.pop();
  delete answers[last.prefix];
  current = last.id;
  render();
}

function showResult() {
  ["progress", "question", "options", "buttons"].forEach(function (id) {
    document.getElementById(id).style.display = "none";
  });
  const r = document.getElementById("result");
  r.style.display = "block";
  r.textContent = buildResult(answers);
  const b = document.createElement("button");
  b.textContent = "Пройти заново";
  b.onclick = function () { location.reload(); };
  r.parentNode.appendChild(b);
}

if (typeof document !== "undefined") render();
