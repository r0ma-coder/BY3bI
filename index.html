// Условные переходы
function nextAfter(nodeId, opt, answers) {
  const n = opt[2];
  if (n === "?FCN") { return { de: "FLT_de", it: "FLT_it", nl: "FLT_nl", cn: "FLT_cn", ae: "FLT_ae" }[answers.fc] || "FB0"; }
  if (n === "?FB2") { return answers.bmode === "year" ? "FB2y" : "FB2t"; }
  if (n === "?FI2") { return answers.fc === "it" ? "FI2" : "FA"; }
  if (n === "?FI") { return (answers.fpay !== "unlimited" && (answers.fc === "it" || answers.fc === "us")) ? "FI" : "FA"; }
  if (n === "?S1") { return "S1_" + (answers.prof === "unknown" ? "it" : answers.prof); }
  if (n === "?S5") { return "S_ARMY"; }
  if (n === "?S5B") {
    const weak = (answers.trial === "none" || answers.trial === "low" || answers.self === "1" || answers.self === "2");
    if (!weak) return "S6";
    return answers.army === "avoid" ? "S5_nr" : "S5";
  }
  if (n === "?WHY") { return "WHY"; }
  if (n === "?P3") { return { phys: "P3a", it: "P3b", math: "P3c" }[answers.prof]; }
  if (n === "?TEST") { return "T_" + answers.prof + "_" + answers.grade + "_1"; }
  if (n === "?M4") {
    return (answers.mot === "par_ok" || answers.mot === "par_no") ? "M4" : "P1";
  }
  return n;
}

function tagParts(tag) { const i = tag.indexOf("="); return [tag.slice(0, i), tag.slice(i + 1)]; }

// Баллы: максимум 57 (олимпиады 14, пробник 12, самооценка 8, оценки 5, время 6, мини-тест 8, проекты 4). Мини-тест: вопрос №i весит i, сумма 0..15 масштабируется в 0..8.
const W = {
  oly:   { "0":0, "0_want":0, "1":2, "2":5, "3":9, "4":14 },
  trial: { none:0, low:1, mid:4, good:8, high:12 },
  self:  { "1":0, "2":2, "3":5, "4":8 },
  gpa:   { low:0, mid:1, good:3, high:5 },
  time:  { low:0, mid:2, high:4, max:6 },
  test:  {},
  proj:  { "0":0, "1":1, "3":3, "4":4 }
};
const MAXSCORE = 14 + 12 + 8 + 5 + 6 + 8 + 4; // 57

function testCorrect(a) { let c = 0; for (let i = 1; i <= 5; i++) if (a["tq" + i] === "1") c++; return c; }
function testPoints(a) { let p = 0; for (let i = 1; i <= 5; i++) if (a["tq" + i] === "1") p += i; return p; }
function testScore(a) { return Math.round(testPoints(a) * 8 / 15); }
function hardestSolved(a) { let h = 0; for (let i = 1; i <= 5; i++) if (a["tq" + i] === "1") h = i; return h; }

function computeTier(a) {
  let s = 0;
  for (const k in W) { if (k === "test") { s += testScore(a); continue; } s += (W[k][a[k]] || 0); }
  const pct = s / MAXSCORE * 100;
  let tier = pct >= 65 ? "A" : pct >= 40 ? "B" : pct >= 20 ? "C" : "D";
  // Жёсткий порог: в Tier A без подтверждения (пробник 85+ или сильная олимпиада) не пускаем,
  // т.к. у МФТИ минимум 85 по профильным, а у МГУ высокие минимумы.
  let capped = false;
  const olyHigh = (a.oly === "3" || a.oly === "4");
  if (tier === "A" && a.trial !== "high" && !olyHigh) { tier = "B"; capped = true; }
  return { score: s, pct: Math.round(pct), tier: tier, capped: capped, correct: testCorrect(a), points: testPoints(a), hardest: hardestSolved(a) };
}

const SUBS = {
  "МФТИ": ["ai","nuclear","pure"],
  "МГУ (ВМК, мехмат, физфак)": ["ai","pure"],
  "НИУ ВШЭ, ФКН (Программная инженерия)": ["dev","ai","data"],
  "МГТУ им. Баумана (Программная инженерия)": ["dev"],
  "МГТУ им. Баумана (Ядерные реакторы 278, Робототехника 305)": ["nuclear","mech","embedded"],
  "НИЯУ МИФИ": ["nuclear"],
  "НИУ МЭИ (энергетика, теплоэнергетика)": ["energy","electro"],
  "МАИ (ИВТ, по программам)": ["aero"]
};
VUZ.forEach(function (v) { v.subs = SUBS[v.n] || []; });

const BAND = { low: [100,150], mid: [150,210], good: [210,255], high: [255,300] };
const CAPMAX = { "1": 500000, "2": 1000000, "3": 2000000, "4": 5000000, "5": 1e12 };

const KEYS = ["low", "mid", "good", "high"];
const LEVEL_IDX = { low: 0, mid: 1, good: 2, high: 3 };
const TIER_IDX = { D: 0, C: 1, B: 2, A: 3 };
function hasTrial(a) { return Object.prototype.hasOwnProperty.call(LEVEL_IDX, a.trial); }
// Уровень = среднее между пробником и общим Tier (в Tier входят тест, олимпиады, самооценка). Нет пробника: только Tier.
function levelKey(a, t) {
  const ti = TIER_IDX[t.tier];
  return KEYS[hasTrial(a) ? Math.round((LEVEL_IDX[a.trial] + ti) / 2) : ti];
}

function vuzStatus(v, a, key) {
  const olyTop = (a.oly === "3" || a.oly === "4");
  const b = BAND[key];
  let st;
  if (v.kind === "d400") {
    st = (key === "high" || olyTop)
      ? { r: 1, s: "возможно: нужен результат 85+ по профильным и подготовка к ДВИ" }
      : { r: 3, s: "пока далеко: нужен результат 85+ и подготовка к ДВИ", gap: 999 };
  } else {
    const lo = v.need[0], hi = v.need[1], mid = (b[0] + b[1]) / 2;
    if (mid >= hi) st = { r: 0, s: "по твоему уровню проходишь с запасом" };
    else if (b[1] >= lo) st = { r: 1, s: "на грани: нужна верхняя часть твоего диапазона" };
    else st = { r: 3, s: "пока далеко: не хватает около " + Math.round(lo - b[1]) + " баллов суммы", gap: Math.round(lo - b[1]) };
  }
  if (olyTop && st.r >= 3) st.s += " (но олимпиада заключительного этапа может дать поступление без экзаменов, проверь условия вуза)";
  return st;
}

function vuzBoost(v, a) {
  let b = 0; const t = v.tags || {};
  if ((a.sci === "yes" || a.career === "science") && t.sci) b += 2;
  if (a.size && a.size === t.size) b += 1;
  if ((a.prio === "comfort" || a.val === "easy") && v.need && v.need[1] <= 265) b += 2;
  if (a.sub && v.subs && v.subs.indexOf(a.sub) >= 0) b += 3;
  if ((a.val === "status" || a.goal === "dream" || a.prio === "same") && t.prest) b += 2;
  if (a.val === "knowledge" && t.modern) b += 2;
  if (a.val === "career" && t.practice) b += 2;
  if (a.prio === "money" && v.paidMin) b -= Math.min(2, Math.round(v.paidMin / 400000));
  return b;
}
function sel(v) { return v.kind === "d400" ? 305 : (v.need ? v.need[1] : 0); }

// Цена года платного обучения к моменту поступления: если цена 2026/27, растёт от сегодняшнего дня; если цена за 2025 год или год неизвестен, считаем ещё один год роста
function paidExtra(v) { return v.pyear === 2026 ? 0 : 1; }
function paidAtEntry(v, a) { return v.paidMin * Math.pow(PRICE_GROWTH, yearsToEntry(a) + paidExtra(v)); }
function paidYearLabel(v) { return v.pyear === 2026 ? "цена 2026/27" : v.pyear === 2025 ? "цена 2025/26" : "год цены не подтверждён"; }
function paidTotal(v, a) { let t = 0; for (let k = 0; k < 4; k++) t += v.paidMin * Math.pow(PRICE_GROWTH, yearsToEntry(a) + paidExtra(v) + k); return t; }

function vuzLine(x, a, capMax, paidMode) {
  const v = x.v;
  let line = "— " + v.n + ": " + x.st.s;
  if (v.need) line += "; проходной " + (v.need[0] === v.need[1] ? v.need[0] : v.need[0] + "–" + v.need[1]);
  if (v.min) line += "; " + v.min;
  if (v.paid) {
    line += "; платное " + v.paid;
    if (v.paidMin) line += " [" + paidYearLabel(v) + "; это нижняя граница, к твоему поступлению реально около " + rub(paidAtEntry(v, a)) + " в год, моё допущение: цены растут на 5% в год]";
    if (paidMode && capMax && v.paidMin && paidTotal(v, a) > capMax) line += " (за 4 года с ростом цен выйдет выше твоего потолка)";
  }
  if (paidMode && !v.paidMin) line += "; цена платного обучения на 2026/27 не найдена, в проверку потолка не включена, проверь на сайте вуза";
  if (a.sub && v.subs.indexOf(a.sub) >= 0) line += "; подходит под твоё направление";
  return line + " [" + v.conf + "]\n";
}

// Короткий список (до 5 вузов): амбициозный + основные + страховка. Чем выше уровень, тем выше конкурс у основных.
function pickList(a, prof, t) {
  const key = levelKey(a, t);
  // Мечта-вуз: находим запись в базе (для Бауманки берём программу под профиль)
  let dv = null;
  if (a.dream === "bmstu") dv = VUZ.filter(function (v) { return v.n.indexOf("МГТУ") === 0 && v.prof.indexOf(prof) >= 0; })[0] || null;
  else if (a.dream && a.dream !== "none" && a.dream !== "other") dv = VUZ.filter(function (v) { return v.n === a.dream; })[0] || null;
  const dreamInProf = !!(dv && dv.prof.indexOf(prof) >= 0 && (dv.need || dv.kind === "d400"));
  const capMax = a.cap ? CAPMAX[a.cap] : null;
  const paidMode = (a.pay === "paid" || a.pay === "budget_first");
  const fit = function (x) { if (!(paidMode && capMax)) return true; if (!x.v.paidMin) return false; return paidTotal(x.v, a) <= capMax; };
  const cand = VUZ.filter(function (v) { return v !== dv && v.prof.indexOf(prof) >= 0 && (v.need || v.kind === "d400"); })
    .map(function (v) { return { v: v, st: vuzStatus(v, a, key), score: sel(v) + vuzBoost(v, a) * 8 }; });
  const lowEdge = function (v) { return v.need ? v.need[0] : 305; };
  const asc = function (x, y) { return lowEdge(x.v) - lowEdge(y.v); };
  const desc = function (x, y) { return y.score - x.score; };
  const ok = cand.filter(function (x) { return x.st.r === 0; });
  const edge = cand.filter(function (x) { return x.st.r === 1; });
  const far = cand.filter(function (x) { return x.st.r === 3; });

  let safePool = ok.filter(fit);
  if (!safePool.length) safePool = ok;
  if (!safePool.length) safePool = cand;
  const safe = safePool.slice().sort(asc)[0] || null;

  const pool = ok.concat(edge).filter(function (x) { return x !== safe; }).sort(desc);
  let amb = null;
  if (pool.length) {
    const top = Math.max.apply(null, pool.map(function (x) { return sel(x.v); }));
    amb = far.filter(function (x) { return x.st.gap < 900 && x.st.gap <= 45 && sel(x.v) >= top; }).sort(asc)[0] || null;
  }
  const main = pool.slice(0, amb ? 2 : 3);
  const L = function (x) { return vuzLine(x, a, capMax, paidMode); };

  let o = "";
  let dreamInfo = null;
  if (dreamInProf) {
    const dst = vuzStatus(dv, a, key);
    dreamInfo = { dv: dv, st: dst };
    o += "ТВОЯ МЕЧТА\n" + L({ v: dv, st: dst });
    if (dst.r === 3) o += "Честно: сейчас до неё далеко, но это ориентир для роста, а не приговор. План ниже построен под эту цель, а список дальше нужен как запасной путь.\n";
    o += "\n";
  } else if (a.dream && a.dream !== "none" && a.dream !== "other") {
    const PN = { phys: "физика и инженерия", it: "информатика и IT", math: "математика" };
    const dvAny = VUZ.filter(function (v) { return v.n === a.dream || (a.dream === "bmstu" && v.n.indexOf("МГТУ") === 0); })[0];
    o += "ТВОЯ МЕЧТА\nМечта-вуз и выбранный профиль (" + PN[prof] + ") не совпадают: " + (dvAny ? "в моей базе эта программа относится к другим направлениям (" + dvAny.prof.map(function (x) { return PN[x]; }).join(", ") + ")" : "в моей базе нет подходящей программы") + ". Либо мечта на самом деле про другое направление, либо у вуза есть программа по твоему профилю, которой у меня нет. Проверь на сайте вуза и, если сомневаешься, пройди опросник ещё раз с другим профилем.\n\n";
  } else if (a.dream === "other") {
    o += "ТВОЯ МЕЧТА\nТвоего вуза нет в моей базе, поэтому проходной я не сравню. Найди на его сайте минимальные баллы и бюджетные места по нужному направлению и сравни с уровнем из этого списка.\n\n";
  }
  if (a.goal === "anywhere") o += "Ты сказал(а), что главное поступить надёжно, поэтому порядок такой: сначала страховка, потом остальное.\n\n";
  o += "ТВОЙ СПИСОК ДЛЯ ПОДАЧИ\n";
  o += "Проходные 2025 года, сумма трёх предметов из 300. Твой уровень оценён примерно в " + BAND[key][0] + "–" + BAND[key][1] +
       " из 300 (" + (hasTrial(a) ? "по пробнику, тесту и ответам" : "по тесту и ответам, пробника нет") +
       "). В список попали только вузы под этот уровень, а не все подряд.\n\n";
  if (amb) o += "АМБИЦИОЗНЫЙ ВАРИАНТ (если подтянешь баллы)\n" + L(amb) + "\n";
  let names = [];
  if (amb) names.push(amb.v.n);
  if (main.length) {
    o += "ОСНОВНЫЕ ВАРИАНТЫ\n" + main.map(L).join("") + "\n";
    main.forEach(function (x) { names.push(x.v.n); });
  } else {
    const goals = far.filter(function (x) { return x !== safe && x.st.gap < 900; }).sort(asc).slice(0, 2);
    if (goals.length) {
      o += "ЦЕЛИ, КОГДА ПОДТЯНЕШЬ БАЛЛЫ\n" + goals.map(L).join("") + "\n";
      goals.forEach(function (x) { names.push(x.v.n); });
    }
  }
  if (safe) {
    let st = "СТРАХОВКА\n" + L(safe);
    if (safe.st.r === 3) st += "Пока даже самый мягкий вариант в моей базе выше твоего уровня, поэтому сначала нужен рост баллов.\n";
    st += "\n";
    names.push(safe.v.n);
    if (a.goal === "anywhere") o = o.replace("ТВОЙ СПИСОК ДЛЯ ПОДАЧИ\n", "ТВОЙ СПИСОК ДЛЯ ПОДАЧИ\n" + st);
    else o += st;
  }
  if (dreamInfo) names.unshift(dreamInfo.dv.n);
  return { text: o, names: names, dream: dreamInfo };
}

// ---------- Время: класс + время года ----------
const SEASON_NAME = { autumn: "осень", winter: "зима", spring: "ранняя весна", summer: "лето" };
// Месяцев до ЕГЭ (конец мая–начало июня 11 класса): осень ≈ 8, зима ≈ 5, ранняя весна ≈ 2, плюс 12 за каждый класс вниз
function monthsToEge(a) {
  const base = { autumn: 8, winter: 5, spring: 2, summer: 10 }[a.season];
  const g = parseInt(a.grade, 10);
  if (base === undefined || !g) return 12;
  return base + 12 * (11 - g);
}
// Обычный календарь ВсОШ: школьный этап сентябрь–октябрь, муниципальный ноябрь–декабрь, региональный январь–февраль, заключительный март–апрель

  autumn: "сейчас идут школьный (сентябрь–октябрь) и муниципальный (ноябрь–декабрь) этапы Всероссийской олимпиады школьников",
  winter: "сейчас идёт региональный этап Всероссийской олимпиады школьников (январь–февраль)",
  spring: "сейчас идёт заключительный этап Всероссийской олимпиады школьников (март–апрель)",
  summer: "олимпиадный сезон ещё впереди: школьный этап начнётся в сентябре, а лето лучшее время подготовиться"
};
function seasonLinesMsk(a) {
  const g = a.grade, se = a.season, mo = monthsToEge(a), L = [];

  } else if (g === "10") {
    L.push("Ты в 10 классе (" + nm + "): до ЕГЭ около " + mo + " мес., и у тебя этот олимпиадный цикл и ещё один в 11 классе. По обычному календарю " + OLY_NOW[se] + ". Времени хватает, чтобы системно подтянуть профильный предмет, но откладывать уже стоит не больше пары месяцев.");
  } else if (g === "11") {
    if (se === "autumn") L.push("Ты в 11 классе (осень): до ЕГЭ около " + mo + " мес. Времени мало, но достаточно. По обычному календарю " + OLY_NOW[se] + ". Сразу выбери 3–4 вуза для подачи и сверь даты приёма документов на их сайтах.");
    if (se === "winter") L.push("Ты в 11 классе (зима): до ЕГЭ около " + mo + " мес. Времени очень мало: " + OLY_NOW[se] + ", а на заключительный этап выходят только те, кто уже прошёл региональный. Основа сейчас ЕГЭ: пробники на время и разбор ошибок, а не новые темы с нуля.");
    if (se === "summer") L.push("Ты переходишь в 11 класс (лето): до ЕГЭ около " + mo + " мес. Лето лучшее время закрыть слабые темы и сделать первый пробный ЕГЭ, чтобы увидеть реальный уровень. Школьный этап олимпиад начнётся в сентябре. Заранее выбери 3–4 вуза и сверь даты приёма документов на их сайтах.");
    if (se === "spring") L.push("Ты в 11 классе (ранняя весна): до ЕГЭ около " + mo + " мес. Новых больших вещей не начинай: решай варианты на время и закрывай слабые задания. Приём документов в вузы по общему правилу начинается в конце июня (обычно с 20 июня), точные даты и условия сверь на сайтах вузов.");
    if (a.oly_plan === "main" && olyLow) {
      if (se === "winter" || se === "spring") L.push("Ты назвал(а) олимпиады главным путём, но уровень пока ниже заключительного этапа, а в 11 классе " + (se === "winter" ? "региональный этап идёт прямо сейчас" : "основные этапы уже прошли") + ": начинать олимпиады как основной путь поздно. Основой считай ЕГЭ, а олимпиаду добавь только как бонус, если уже есть результат прошлых лет.");
      else L.push("Ты назвал(а) олимпиады главным путём, но уровень пока ниже заключительного этапа: осень 11 класса последний реальный момент выходить на региональный этап зимой. Ставить только на олимпиады рискованно, держи ЕГЭ как основу.");
    }
  }
  return L;
}
function foreignTimingLines(a) {
  const g = a.grade, se = a.season, fc = a.fc, mo = monthsToEge(a), L = [];
  const nm = SEASON_NAME[se] || "";
  const late = (g === "11" && (se === "winter" || se === "spring"));

  const T = {

          : "Нидерланды: срок 15 января на программы с отбором прошёл; у программ без отбора сроки другие и их нужно смотреть на сайте вуза.")),
    it: early ? "Италия: вступительные тесты (TOLC-I, CEnT-S) идут с весны (у Politecnico di Milano сессии с марта); заранее придётся пройти Foundation Year и легализовать документы (это 4–5 месяцев)."
      : (late ? "Италия: тесты идут с весны, а легализация документов занимает 4–5 месяцев, поэтому, если документы ещё не поданы, в этот цикл вряд ли успеть: следующий год можно занять Foundation Year (там нужен итальянский)."

    us: early ? "США: обычно ранние сроки подачи 1 ноября, основные 1–15 января (проверь); SAT и английский сдаются за границей, поэтому планируй поездки заранее."

    cn: early ? "Китай: сроки у вузов разные и обычно приходятся на период от осени до весны; для программы на китайском успеешь выйти на HSK 4–5."
      : (late ? "Китай: сроки у вузов разные, проверь страницу набора конкретного вуза; для программы на китайском без HSK 4–5 этот цикл вряд ли получится."
        : "Китай: сроки у вузов разные, проверь страницу набора конкретного вуза и заранее оцени, есть ли HSK."),
    ae: early ? "ОАЭ: набор идёт несколько раз в год (обычно сентябрь и январь), срок не такой жёсткий, как в США или Великобритании."
      : "ОАЭ: набор идёт несколько раз в год (обычно сентябрь и январь), поэтому поздний старт возможен; у NYU Abu Dhabi сроки через Common App жёсткие, проверь."
  };
  if (T[fc]) L.push(T[fc]);
  if (late && a.army === "avoid") L.push("Ты не хочешь рисковать призывом, а в этом цикле зарубежные сроки могут не успеть: год без учёбы обычно означает призыв. Подай параллельно в российский вуз как запасной вариант.");
  return L;
}

function buildResult(a) {

  const t = computeTier(a);
  const prof = (a.prof && a.prof !== "unknown") ? a.prof : "it";
  const paidWord = (a.pay === "paid" || a.pay === "budget_first");
  let out = "";
  out += "Уровень готовности: Tier " + t.tier + " (" + t.pct + "% от максимума). Мини-тест: верно " + t.correct + " из 5, набрано " + t.points + " из 15 баллов сложности" + (t.hardest ? ", самый сложный решённый вопрос №" + t.hardest : ", ни один вопрос не решён") + " (вопросы идут от простого к сложному, вес вопроса равен его номеру).\n";
  if (t.capped) out += "Баллы тянули на Tier A, но подтверждённого результата нет (пробник 85+ или сильная олимпиада), поэтому уровень снижен до B: у МФТИ минимум 85 по профильным, у МГУ высокие минимумы и ДВИ. Подтверди результат пробником, и Tier A откроется.\n";
  out += "\n";
  const pl = pickList(a, prof, t);
  out += pl.text;

  // Что учтено при отборе
  let pr = [];

  if (a.prio === "money") pr.push("стоимость обучения (при равных шансах ниже стоят более дорогие платные варианты)");

  if (a.val === "knowledge" && prof === "it") {

    out += "По остальным вузам из списка (МИСИС, МЭИ, МАИ, Политех, МИРЭА, РУДН, Финансовый университет) у меня нет надёжных фактов про состав и подход преподавателей — отзывы студентов по ним противоречивые, где-то хвалят, где-то жалуются на тех же специальностях в разные годы. Сходи на день открытых дверей или поговори с текущими студентами этих вузов напрямую, это надёжнее любых отзывов в интернете.\n";
  }
  if (a.val === "social")

  if (a.val === "unclear")
    out += "Ты пока не представляешь чётко, каким должен быть вуз, и это нормально. Список ниже собран просто по уровню и профилю, без лишних акцентов, а когда появится ощущение, что важнее, пройди опросник ещё раз.\n";
  if (pr.length || a.val === "knowledge" || a.val === "social" || a.val === "unclear") out += "\n";

  // Деньги и география
  let notes = [];
  if (a.pay === "budget_only" && (t.tier === "C" || t.tier === "D"))
    notes.push("Ты выбрал только бюджет, а текущий уровень — Tier " + t.tier + ". Нужен план роста баллов и/или олимпиады, и обязательно запасной путь (целевое обучение, менее конкурентное направление).");
  if (paidWord && (a.cap === "1" || a.cap === "2"))
    notes.push("Потолок до 1 млн ₽ на всё обучение: платное в вузах из базы стоит от ~300 тыс. ₽ в год, а в самых конкурсных до ~1 млн ₽ в год, то есть на 4 года выходит заметно дороже. Реалистичный путь — бюджет, целевое или скидки за достижения.");
  if (paidWord) notes.push("Я считаю только плату за обучение: общежитие, жизнь в Москве и дорога в потолок не входят, а цены платного обучения на 2026/27 подтверждены не для всех вузов (у части год цены не подтверждён, у нескольких цены нет, это отмечено в списке). Закладывай запас: цены в 2026 году выросли у ведущих вузов на 20–30%.");
  if (a.opt === "target") notes.push("Целевое обучение: нужно заранее искать предприятие-заказчика, это отдельный процесс со своими сроками.");

  if (a.why === "others")

  if (a.why === "unsure")
    notes.push("Ты сам(а) не уверен(а), что " + PROF_NAME[prof] + " — твоё. Стоит пройти опросник ещё раз с соседним профилем и сравнить, какой список вузов и какая подготовка ощущаются ближе, а не выбирать по инерции.");
  if (a.par === "prestige" && t.tier !== "A")
    notes.push("Родителям важен престиж: можно оставить одну «статусную» попытку в списке, но не строить на ней весь план.");
  if (a.army === "avoid") {
    notes.push("Учёба сейчас в приоритете, поэтому вариант «пересдать через год» не рассматриваем: обычно отсрочку получают студенты очной формы в аккредитованных вузах, значит поступать нужно сразу после школы. Условия отсрочки проверь в военкомате или на Госуслугах, я их не проверял.");
    if (a.pay === "budget_only" && (t.tier === "C" || t.tier === "D"))
      notes.push("«Только бюджет» при таком уровне опасен: если не пройдёшь на бюджет, в год призыва можешь остаться без вуза. Добавь в список платный или менее конкурентный вариант, который точно возьмёт.");

  if (a.oly_plan === "main" && olyLow)

    plan.push("Поставь контрольную точку: после отборочного этапа осенью посмотри на результат. Прошёл дальше — можно вкладываться сильнее. Не прошёл — всё время на ЕГЭ, без чувства вины.");

    if (a.oly_backup === "wait" && a.army === "avoid")
      plan.push("Поступить нужно именно сейчас, а план «если не выйдет, попробую на следующий год» с этим не сочетается: год после школы без учёбы обычно означает призыв. Лучше сразу заложить запасной вариант на этот год.");

const EN_REQ = { de: null, uk: 6.0, it: null, nl: 6.5, us: 6.5, cn: 6.5, ae: 5.5 };
const EN_EST = [3.5, 4.5, 5.0, 5.5, 6.5, 7.0];
const EN_LABEL = ["ниже A2", "около A2", "около B1", "около B1–B2", "около B2", "около C1"];

function enCorrect(a) { let c = 0; for (let i = 1; i <= 5; i++) if (a["te" + i] === "1") c++; return c; }
function lCorrect(a) { let c = 0; for (let i = 1; i <= 3; i++) if (a["tl" + i] === "1") c++; return c; }

function rub(x) {
  if (x >= 1e6) return (Math.round(x / 1e5) / 10).toString().replace(".", ",") + " млн ₽";
  return Math.round(x / 1000) + " тыс. ₽";
}

function rng(lo, hi) { const a = rub(lo), b = rub(hi); return a === b ? a : a.replace(" ₽", "") + "–" + b; }

// ---------- ISEE (итальянский показатель дохода семьи) ----------
// ISEE = (доход + 20% имущества) / коэффициент семьи. Коэффициенты: 1; 1,57; 2,04; 2,46; 2,85; дальше +0,35 за человека.
const INC_MID = { "1": 2.0e6, "2": 4.0e6, "3": 6.0e6, "4": 9.5e6, "5": 14.5e6, "6": 22e6 };
const FAM_SCALE = { "2": 1.57, "3": 2.04, "4": 2.46, "5": 2.85, "6": 3.3 };
const ASSET_MID = { "1": 2.5e6, "2": 10e6, "3": 22.5e6, "4": 40e6 };
function iseeEst(a) {
  if (!a.inc || !a.fam || !a.asset) return null;
  const inc = INC_MID[a.inc] / FX.EUR;
  const isp = Math.max(0, ASSET_MID[a.asset] / FX.EUR - 52500); // из имущества вычитается около 52 500 € (жильё)
  const v = (inc + 0.2 * isp) / FAM_SCALE[a.fam];
  return { v: v, lo: v * 0.85, hi: v * 1.15 };
}
function polimiFee(x) {
  if (x <= 23120) return 890.04;
  if (x <= 27000) return 890.04 + (x - 23120) / (27000 - 23120) * (1631.04 - 890.04);
  if (x <= 31000) return 1631.04;
  if (x <= 40000) return 1945.04;
  return Math.min(3943.04, 1945.04 + (x - 40000) / (75000 - 40000) * (3943.04 - 1945.04));
}
function bolognaFee(x) {
  const flat = 1157.04; let docs;
  if (x <= 27000) docs = 157.04;
  else if (x <= 33000) docs = (x - 23000) * 0.09 + 157.04;
  else docs = Math.min(2040, (x - 13000) * 0.045) + 157.04;
  return Math.min(docs, flat);
}

// ---------- Рост цен и срок до поступления ----------
const PRICE_GROWTH = 1.05; // допущение автора: цены растут примерно на 5% в год
function yearsToEntry(a) { return Math.max(0, (monthsToEge(a) + 3) / 12); } // поступление в сентябре после ЕГЭ

function foreignCost(c, t, life, a) {
  if (!t.fee && t.lo == null) return null;
  const y0 = yearsToEntry(a);
  const cr = FX[t.cur || c.cur];
  let tl, th;
  if (t.fee) { const f = t.fee(a); tl = f[0]; th = f[1]; } else { tl = t.lo; th = (t.hi != null ? t.hi : t.lo); }
  const pr = t.prep || c.prepCost;
  const n = c.years + c.prep;
  let mLive = 0;
  if (!t.allIn) {
    mLive = LIFE[life] * FX.USD;
    if (c.floorEurMonth) mLive = Math.max(mLive, c.floorEurMonth * FX.EUR);
  }
  const ins = c.insurance ? c.insurance.amt * FX[c.insurance.cur] : 0;
  const v = c.visa || {};
  const visa = (v.usd || 0) * FX.USD + (v.eur || 0) * FX.EUR + (v.gbp || 0) * FX.GBP;
  function sum(useG, side) { // side 0 = нижняя граница, 1 = верхняя
    let tot = 0;
    for (let k = 0; k < n; k++) {
      const g = useG ? Math.pow(PRICE_GROWTH, y0 + k) : 1;
      let tuition;
      if (k < c.prep) tuition = pr ? pr[side] * FX[c.cur] : 0;
      else tuition = (side ? th : tl) * cr;
      tot += g * (tuition + mLive * 12 + 2 * c.flightRub[side] + ins);
    }
    tot += visa + c.examRub[side] + c.applyRub[side] + (c.visaTrip ? c.visaTrip[side] : 0);
    return tot;
  }
  return { nowLo: sum(false, 0), nowHi: sum(false, 1), lo: sum(true, 0), hi: sum(true, 1), n: n };
}

function buildForeignResult(a) {

      sp.push("Оценка ISEE для Италии по твоим ответам: около " + Math.round(e.v / 100) * 100 + " € (с запасом ±15%, то есть примерно " + Math.round(e.lo / 100) * 100 + "–" + Math.round(e.hi / 100) * 100 + " €). Считал так: ISEE = (годовой доход семьи + 20% имущества) ÷ коэффициент семьи (" + String(FAM_SCALE[a.fam]).replace(".", ",") + " при " + (a.fam === "6" ? "6 и более" : a.fam) + " чел.), доход перевёл в евро по курсу ЦБ, а из имущества вычел около 52 500 € на жильё. Это грубая оценка по диапазонам: точный ISEEU parificato считает центр CAF по документам, которые нужно собрать и легализовать (на это уходит несколько месяцев). Разные вузы используют его по-разному: Politecnico di Milano ставит по нему платную полосу (минимум около 890 € в год), Bologna освобождает от переменной части при ISEE до 27 000 € и для россиян даёт льготную фиксированную плату, Sapienza ISEE для иностранных доходов не учитывает, Padova берёт фиксированную плату.");
    } else {
      sp.push("Для Италии без справок о доходе в расчёте стоят суммы без документов: максимум у Politecnico di Milano (3 943,04 € в год) и льготная фиксированная плата у Bologna. Если семья готова собирать документы для ISEEU parificato, плата в Politecnico di Milano может быть заметно ниже (от около 890 € в год).");
    }
  }
  if (a.fc === "cn" && !unlimited)
    sp.push("В Китае есть государственный грант CSC: он может покрыть обучение, общежитие и ежемесячную стипендию. Если получишь его, стоимость пути сильно упадёт, поэтому проверь условия и сроки подачи на грант до того, как отказываться от страны по цене. В строке с грантом выше жильё всё равно посчитано полностью, поэтому реальная сумма может быть ниже.");
  if (a.fc === "ae" && !unlimited)
    sp.push("NYU Abu Dhabi заявляет покрытие 100% подтверждённой потребности для принятых студентов; для иностранцев (не только американцев) условия нужно уточнять напрямую у вуза.");
  if (sp.length) o += "ОСОБЕННОСТИ ЦЕНЫ\n" + sp.map(function (x) { return "— " + x; }).join("\n") + "\n\n";

  // Виза
  const v = c.visa || {};
  let vs = [];
  if (v.note) vs.push(v.note);
  if (c.visaTime) vs.push(c.visaTime);
  if (vs.length) o += "ВИЗА\n" + vs.map(function (x) { return "— " + x; }).join("\n") + "\n\n";

  // Армия
  if (a.army === "avoid" || a.army === "ok") {
    o += "АРМИЯ И ВОИНСКИЙ УЧЁТ\nПо статье 10 закона о воинской обязанности (53-ФЗ) нужно сообщить военкомату о выезде из России на срок более 6 месяцев: через Госуслуги или письменно, срок называют две недели. Выезд сам по себе с учёта не снимает: снятие нужно оформлять заявлением, а по возвращении нужно снова сообщить о въезде в течение двух недель. Это пересказ юридических сайтов, сам текст закона я не открывал, поэтому порядок в твоём случае уточни в военкомате или на Госуслугах, я не юрист. Отсрочка от призыва для студентов обычно привязана к российским аккредитованным вузам очной формы, поэтому учёба за границей её может не давать: узнай это до отъезда.\n\n";
  }

  // План
  let plan = [];
  if (est < (th || 0) || (a.fc === "uk" && est < 6)) plan.push("Подтяни английский и сдай официальный IELTS или TOEFL: по мини-тесту до порога страны не хватает.");
  if (a.lready !== "eng" && LANGS[a.fc] && a.fc !== "ae") plan.push("Начни учить язык страны заранее, это снимет часть барьеров и расширит выбор программ.");
  if (a.fc === "de") plan.push("Определи путь: Studienkolleg или 1–2 года в российском вузе из списка H+; для Studienkolleg заранее готовь немецкий B1–B2 и документы для uni-assist.");
  if (a.fc === "uk") plan.push("Выбери 3–4 вуза с Foundation Year, сверь дедлайны UCAS (15 октября и 29 января) и требования по IELTS.");
  if (a.fc === "it") plan.push("Реши, как закрыть «12-й год», и заранее выясни, как оформляется ISEE для иностранной семьи.");
  if (a.fc === "nl") plan.push("Выясни у выбранных вузов порог среднего балла аттестата для прямого поступления: источник называет около 4,5, но это нужно проверить.");
  if (a.fc === "us") plan.push("Реши, нужен ли SAT или ACT: у части вузов он обязателен, у других нет. Заранее подготовь заверенный транскрипт и план поездки за визой в третью страну.");
  if (a.fc === "cn") plan.push("Выбери язык программы (китайский или английский) и проверь сроки подачи на грант CSC.");
  if (a.fc === "ae") plan.push("Составь список вузов под свой бюджет (федеральные дешевле филиалов западных вузов) и проверь, нужен ли Foundation Year при твоём английском.");
  foreignTimingLines(a).forEach(function (x) { plan.push(x); });
  plan.push("Перед подачей сверь все цены, пороги и дедлайны на сайтах вузов: цифры выше собраны 03.10.2026.");
  o += "ПЛАН ДЕЙСТВИЙ\n" + plan.map(function (x, i) { return (i + 1) + ". " + x; }).join("\n") + "\n\n";

  o += "(Суммы собраны на 03.10.2026 из сайтов вузов, посольств и сводок; «от» значит нижняя граница, реальные цифры выше. В расчёт не вошли: " + c.miss + ". Шкала расходов на жизнь общая и не учитывает, что в Лондоне, Нью-Йорке, Милане или Амстердаме то же самое стоит заметно дороже.)\n";
  return o;
}

// ---------- интерфейс ----------

// ===== ОБРАТНАЯ СВЯЗЬ ЧЕРЕЗ ЯНДЕКС.ФОРМЫ =====
// ВАЖНО: вставь сюда свои две ссылки на Яндекс.Формы после того, как создашь их в своём аккаунте.
// FORM_GENERAL — форма общих вопросов/предложений к проекту (без автозаполнения).
// FORM_QUESTION — форма "свой вариант ответа" для конкретного вопроса (с автозаполнением контекста через параметры запроса).
const FORM_GENERAL_URL = "https://clck.ru/3WGjSC";
const FORM_QUESTION_URL = "https://forms.yandex.ru/u/6ac0b3ba84227ceedfa4ab1e/";
// Названия скрытых полей (используй ТЕ ЖЕ названия при создании скрытых полей в форме №2 на forms.yandex.ru):
const FQ_PARAM_NODE = "node";       // id текущего узла дерева, напр. T_phys_10_3
const FQ_PARAM_CONTEXT = "context"; // человекочитаемая сводка: профиль, класс, ответы на вопросы до этого момента

function openGeneralFeedback() {
  window.open(FORM_GENERAL_URL, "_blank");
}

function buildAnswersSummary() {
  const parts = [];
  if (answers.prof) parts.push("профиль: " + answers.prof);
  if (answers.grade) parts.push("класс: " + answers.grade);
  for (const k in answers) {
    if (k === "prof" || k === "grade") continue;
    parts.push(k + "=" + answers[k]);
  }
  return parts.join(", ");
}

function openQuestionFeedback(nodeId, questionText) {
  const summary = buildAnswersSummary();
  const context = "Вопрос: " + String(questionText).slice(0, 150) + " | Ответы до этого момента: " + (summary || "пока нет");
  const url = FORM_QUESTION_URL
    + "?" + FQ_PARAM_NODE + "=" + encodeURIComponent(nodeId)
    + "&" + FQ_PARAM_CONTEXT + "=" + encodeURIComponent(context);
  window.open(url, "_blank");
}
// ===== /ОБРАТНАЯ СВЯЗЬ =====

let current = "DREAM";
let history = [];        // стек: [{id, tag}]
let answers = {};        // prefix -> value

function render() {
  const q = TREE[current];
  document.getElementById("progress").textContent = "Шаг " + (history.length + 1);
  document.getElementById("question").textContent = q.text;
  const box = document.getElementById("options");
  box.innerHTML = "";
  const prevTag = (history.length && history[history.length - 1].id === current) ? null : null;
  q.options.forEach(function (opt) {
    const label = document.createElement("label");
    label.className = "option";
    const input = document.createElement("input");
    input.type = "radio"; input.name = "opt"; input.value = opt[1];
    const p = tagParts(opt[1]);
    if (answers[p[0]] === p[1] && savedFor[current] === opt[1]) input.checked = true;
    label.appendChild(input);
    label.appendChild(document.createTextNode(opt[0]));
    box.appendChild(label);
  });
  document.getElementById("backBtn").style.display = history.length ? "inline-block" : "none";
  document.getElementById("suggestBtn").textContent = q.isTest ? "Сообщить об ошибке в вопросе" : "Предложить свой вариант ответа";
}

let savedFor = {}; // id вопроса -> выбранный тег (чтобы при возврате ответ был отмечен)

function goNext() {
  const checked = document.querySelector('input[name="opt"]:checked');
  if (!checked) { alert("Выбери один из вариантов"); return; }
  const q = TREE[current];
  const opt = q.options.filter(function (o) { return o[1] === checked.value; })[0];
  const p = tagParts(opt[1]);
  answers[p[0]] = p[1];
  savedFor[current] = opt[1];
  history.push({ id: current, prefix: p[0] });
  const nxt = nextAfter(current, opt, answers);
  if (nxt === "FINAL") { showResult(); return; }
  current = nxt;
  render();
}

function goBack() {
  if (!history.length) return;
  const last = history.pop();
  delete answers[last.prefix];
  current = last.id;
  render();
}

function showResult() {
  ["progress", "question", "options", "buttons"].forEach(function (id) {
    document.getElementById(id).style.display = "none";
  });
  const r = document.getElementById("result");
  r.style.display = "block";
  r.textContent = buildResult(answers);
  const b = document.createElement("button");
  b.textContent = "Пройти заново";
  b.onclick = function () { location.reload(); };
  r.parentNode.appendChild(b);
}

if (typeof document !== "undefined") render();
</script>
